[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h5ad-obs"
version = "0.2.0"
description = "Read the obs table out of a remote .h5ad over HTTP range requests, without downloading the matrix."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "David Osumi-Sutherland" }]
keywords = ["anndata", "h5ad", "single-cell", "range-requests"]
dependencies = [
  "certifi",
  "fsspec>=2024.2",
  "aiohttp",
  "h5py",
  "numpy",
  "pandas",
  "pyarrow",
  "cap-client @ git+https://github.com/Cellular-Semantics/cap_skills@v0.2.0#subdirectory=packages/cap-client",
]

[project.scripts]
h5ad-obs = "h5ad_obs.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/h5ad_obs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network; excluded from CI"]
addopts = "-m 'not live'"
