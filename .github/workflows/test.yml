name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uvx ruff check packages/

  cap-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e "packages/cap-client[test]"
      # Live tests are excluded by the package's addopts: they hit celltype.info.
      # The eval *graders* are pure functions and free to test; the eval runs
      # themselves cost money and hit a live dataset, so they are never in CI.
      - run: uv run pytest packages/cap-client evals -q

  install-from-git:
    # The published contract: what a user actually gets from the SKILL.md command.
    # Runs on main only, where the tag the skills pin is expected to exist.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: cap CLI resolves and reports its version
        run: |
          uvx --from "git+https://github.com/${{ github.repository }}@${{ github.sha }}#subdirectory=packages/cap-client" \
            cap --version
